<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlowSync Finance</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <header class="p-4 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">FlowSync</h1>
      <p class="text-xs text-slate-400" id="txCount">Memuat data...</p>
    </div>
    <button onclick="fetchDataFromSheets()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-medium rounded-lg border border-slate-700 flex items-center gap-1.5">
      <span>🔄 Refresh</span>
    </button>
  </header>

  <main class="p-4 flex-1 max-w-md mx-auto w-full space-y-4">

    <section class="bg-gradient-to-br from-slate-800 to-slate-800/60 p-4 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
      <div>
        <p class="text-xs font-medium text-slate-400">Arus Kas Bersih (Net Flow 2026)</p>
        <h2 id="netFlowVal" class="text-2xl font-bold text-white tracking-tight">Rp 0</h2>
      </div>
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/50 text-xs">
        <div class="bg-emerald-950/40 border border-emerald-900/50 p-2.5 rounded-xl">
          <p class="text-emerald-400 font-medium">Total Masuk</p>
          <p id="totalMasukVal" class="text-sm font-bold text-slate-200 mt-0.5">Rp 0</p>
        </div>
        <div class="bg-rose-950/40 border border-rose-900/50 p-2.5 rounded-xl">
          <p class="text-rose-400 font-medium">Total Keluar</p>
          <p id="totalKeluarVal" class="text-sm font-bold text-slate-200 mt-0.5">Rp 0</p>
        </div>
      </div>
    </section>

    <details class="bg-slate-800/40 border border-slate-800 rounded-xl overflow-hidden group">
      <summary class="p-3 text-xs font-semibold text-slate-300 cursor-pointer flex justify-between items-center select-none">
        <span>➕ Input Transaksi Baru</span>
        <span class="text-slate-500 group-open:rotate-180 transition-transform">▼</span>
      </summary>
      <div class="p-3 pt-0 space-y-2">
        <textarea id="notifInput" rows="2" placeholder="Contoh: Kopi Nako Rp 35.000 QRIS"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
        <button onclick="kirimTransaksi()" id="btnKirim"
          class="w-full py-2 bg-blue-600 hover:bg-blue-500 font-medium rounded-lg text-xs transition">
          Kirim ke Sheets
        </button>
        <p id="statusMsg" class="text-[11px] text-center hidden"></p>
      </div>
    </details>

    <section class="space-y-2">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Transaksi Terbaru</h3>
      <div id="txList" class="space-y-2">
        <div class="p-4 text-center text-xs text-slate-500">Menghubungkan ke Google Sheets...</div>
      </div>
    </section>

    <details class="bg-slate-800/20 border border-slate-800/60 rounded-xl">
      <summary class="p-3 text-[11px] text-slate-500 cursor-pointer select-none">Pengaturan Web App URL</summary>
      <div class="p-3 pt-0 space-y-2">
        <input type="password" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
        <button onclick="simpanUrl()" class="w-full py-1.5 bg-slate-700 rounded-lg text-xs font-medium text-slate-300">
          Simpan URL
        </button>
      </div>
    </details>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    const fmtIDR = (num) => "Rp " + Math.round(num).toLocaleString("id-ID");

    document.addEventListener("DOMContentLoaded", () => {
      const savedUrl = localStorage.getItem("gas_webhook_url");
      if (savedUrl) {
        document.getElementById("gasUrlInput").value = savedUrl;
        fetchDataFromSheets();
      } else {
        document.getElementById("txList").innerHTML = 
          '<div class="p-4 text-center text-xs text-amber-400">Harap masukkan dan simpan Web App URL di menu Pengaturan bawah.</div>';
      }
    });

    function simpanUrl() {
      const url = document.getElementById("gasUrlInput").value.trim();
      if (!url) return alert("URL tidak boleh kosong!");
      localStorage.setItem("gas_webhook_url", url);
      alert("URL tersimpan! Memuat data...");
      fetchDataFromSheets();
    }

    async function fetchDataFromSheets() {
      const url = localStorage.getItem("gas_webhook_url");
      if (!url) return;

      const txListEl = document.getElementById("txList");
      const txCountEl = document.getElementById("txCount");

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "success") {
          txCountEl.innerText = `${data.totalTransactions} Transaksi Tersinkron`;
          document.getElementById("netFlowVal").innerText = fmtIDR(data.summary.netFlow);
          document.getElementById("totalMasukVal").innerText = fmtIDR(data.summary.pemasukan);
          document.getElementById("totalKeluarVal").innerText = fmtIDR(data.summary.pengeluaran);

          let html = "";
          data.transactions.forEach(t => {
            const isMasuk = t.tipe === "PEMASUKAN";
            const color = isMasuk ? "text-emerald-400" : "text-slate-200";
            const sign = isMasuk ? "+" : "-";

            html += `
              <div class="bg-slate-800/60 border border-slate-700/50 p-3 rounded-xl flex justify-between items-center text-xs">
                <div class="space-y-0.5 max-w-[65%]">
                  <p class="font-semibold text-slate-200 truncate">${t.merchant}</p>
                  <p class="text-[10px] text-slate-400">${t.kategori} • ${t.waktu}</p>
                </div>
                <div class="text-right">
                  <p class="font-bold ${color}">${sign} ${fmtIDR(t.nominal)}</p>
                  <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-700/50 text-slate-400">${t.tipe}</span>
                </div>
              </div>
            `;
          });

          txListEl.innerHTML = html;
        } else {
          txListEl.innerHTML = '<div class="p-4 text-center text-xs text-rose-400">Gagal memuat data dari spreadsheet.</div>';
        }
      } catch (err) {
        txListEl.innerHTML = `<div class="p-4 text-center text-xs text-rose-400">Error koneksi: ${err.message}</div>`;
      }
    }

    async function kirimTransaksi() {
      const text = document.getElementById("notifInput").value.trim();
      const webhookUrl = localStorage.getItem("gas_webhook_url");
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("btnKirim");

      if (!webhookUrl || !text) return alert("Isi teks transaksi terlebih dahulu!");

      btn.disabled = true;
      btn.innerText = "Memproses...";
      statusMsg.className = "text-[11px] text-center text-slate-400 block";
      statusMsg.innerText = "Mengirim...";

      try {
        await fetch(webhookUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ time: new Date().toLocaleString("id-ID"), app: "FlowSync Web", text: text })
        });

        statusMsg.innerText = "✅ Berhasil dicatat!";
        statusMsg.className = "text-[11px] text-center text-emerald-400 block";
        document.getElementById("notifInput").value = "";
        setTimeout(fetchDataFromSheets, 1500);
      } catch (err) {
        statusMsg.innerText = "❌ Gagal: " + err.message;
        statusMsg.className = "text-[11px] text-center text-rose-400 block";
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim ke Sheets";
      }
    }
  </script>
</body>
</html>
